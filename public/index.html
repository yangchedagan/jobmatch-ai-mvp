<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobMatch AI MVP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="cover-visible">
    <section id="coverPage" class="cover-page" aria-label="JobMatch AI 封面">
      <div class="cover-paper" aria-hidden="true"></div>
      <div class="cover-stage">
        <div class="cover-wordmark cover-brand-mark" aria-label="JobMatch AI">
          <span class="wordmark-main" aria-hidden="true">
            <span class="wordmark-job">Job</span><span class="wordmark-match">Match</span>
          </span>
          <sup>AI</sup>
        </div>

        <div class="cover-scene ink-scene" aria-hidden="true">
          <span class="ink-cloud cloud-left"><img src="/ink-clouds.webp" alt="" /></span>
          <span class="ink-cloud cloud-right"><img src="/ink-clouds.webp" alt="" /></span>

          <div class="ink-bird-flight">
            <div class="ink-bird-arc">
              <img class="bird-frame bird-gliding" src="/ink-bird-fly.png" alt="" />
              <img class="bird-frame bird-perched" src="/ink-bird-perch.png" alt="" />
            </div>
          </div>

          <div class="ink-water">
            <span class="ink-ripple ripple-a"></span>
            <span class="ink-ripple ripple-b"></span>
            <span class="ink-ripple ripple-c"></span>
            <div class="ink-leaf-wrap">
              <img class="ink-leaf-img" src="/ink-leaf.png" alt="" />
            </div>
          </div>
        </div>

        <div class="cover-actions">
          <div class="cover-copy">
            <h2 class="cover-calligraphy cover-calligraphy-bottom" aria-label="良禽择木而栖">
              <span class="calligraphy-text calligraphy-line calligraphy-line-lead" aria-hidden="true">
                <i>良</i><i>禽</i>
              </span>
              <span class="calligraphy-text calligraphy-line calligraphy-line-rest" aria-hidden="true">
                <i>择</i><i>木</i><i>而</i><i>栖</i>
              </span>
            </h2>
            <p class="cover-sub">
              <span>SMART CAREER MATCHING</span>
              <span>让每一次落点都算数</span>
            </p>
            <button id="coverPathBtn" class="cover-link-button" type="button">Find your path ↓</button>
          </div>

          <div class="cover-cta-group" aria-label="进入应用">
            <button id="coverWorkbenchBtn" class="cover-tile cover-tile-dark" type="button">W.</button>
            <button id="coverEnterBtn" class="cover-tile cover-tile-primary" type="button">和 AI 开始对话</button>
          </div>

        </div>
      </div>
    </section>

    <header class="side-rail">
      <div class="brand-block">
        <p class="eyebrow">JobMatch AI</p>
        <h1>求职能力闭环迭代助手</h1>
      </div>
      <nav class="view-tabs" aria-label="主流程导航">
        <button id="agentTab" class="view-tab active" data-page="agent" type="button">AI 助手</button>
        <button id="workbenchTab" class="view-tab" data-page="workbench" type="button">岗位工作台</button>
        <button id="reportTab" class="view-tab" data-page="report" type="button">匹配报告</button>
        <button id="intelligenceTab" class="view-tab" data-page="intelligence" type="button">岗位情报雷达</button>
      </nav>
      <div class="rail-footer">
        <span id="health" class="status-dot">启动中</span>
        <div class="rail-tools">
          <a class="ghost-button admin-link" href="/admin">后台</a>
          <button id="crawlJobsBtn" class="ghost-button" title="按 robots 与限速抓取官方招聘入口" type="button">抓取</button>
          <button id="syncJobsBtn" class="icon-button" title="同步岗位库" type="button">↻</button>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <section id="agentPage" class="page-view agent-page active" aria-label="AI 求职助手">
        <div class="chat-shell">
          <div id="chatStream" class="chat-stream" aria-live="polite"></div>

          <div class="chat-dock">
            <div class="chat-chips" role="group" aria-label="快捷指令">
              <button type="button" class="chat-chip" data-chip="sample">载入示例简历</button>
              <button type="button" class="chat-chip" data-chip="recommend">推荐 Top10 岗位</button>
              <button type="button" class="chat-chip" data-chip="campus">找产品经理校招岗</button>
              <button type="button" class="chat-chip" data-chip="radar">面试考什么</button>
            </div>
            <form id="chatComposer" class="chat-composer">
              <label class="chat-attach" for="chatFile" title="上传简历文件（PDF / TXT / 图片）">
                <input id="chatFile" type="file" accept=".pdf,.txt,.md,.json,.png,.jpg,.jpeg" />
                <span aria-hidden="true">⊕</span>
              </label>
              <div class="chat-input-wrap">
                <span id="chatAttachmentPill" class="chat-attachment-pill" hidden>
                  <span id="chatAttachmentName"></span>
                  <button type="button" id="chatAttachmentClear" aria-label="移除附件">×</button>
                </span>
                <textarea id="chatInput" rows="1" placeholder="告诉我你想做什么，比如：解析我的简历 / 匹配字节的产品岗……"></textarea>
              </div>
              <button id="chatSendBtn" class="chat-send" type="submit" aria-label="发送">↑</button>
            </form>
          </div>
        </div>
      </section>

      <section id="workbenchPage" class="page-view workbench-page" aria-label="岗位工作台">
        <div class="workspace workbench-grid">
          <section class="panel resume-panel">
            <div class="panel-heading">
              <div>
                <span class="section-index">01</span>
                <h2>简历解析</h2>
              </div>
              <button id="sampleResumeBtn" type="button" class="ghost-button">载入示例</button>
            </div>

            <form id="resumeForm" class="upload-zone">
              <label id="dropZone" class="drop-zone" for="resumeFile">
                <input id="resumeFile" name="resumeFile" type="file" accept=".pdf,.txt,.md,.json,.png,.jpg,.jpeg" />
                <span class="upload-icon">↑</span>
                <strong id="fileName">拖拽或点击上传</strong>
                <small>PDF / TXT / PNG / JPG，≤ 10 MB</small>
              </label>
              <textarea id="resumeText" name="resumeText" rows="8" placeholder="也可以直接粘贴简历正文"></textarea>
              <div class="stepper" aria-label="解析进度">
                <span data-step="upload">上传中</span>
                <span data-step="parse">解析中</span>
                <span data-step="done">完成</span>
              </div>
              <button class="primary-button" type="submit">解析简历</button>
            </form>

            <div id="resumePreview" class="preview empty-state">暂无简历</div>
          </section>

          <section class="panel jobs-panel">
            <div class="panel-heading">
              <div>
                <span class="section-index">02</span>
                <h2>岗位库</h2>
              </div>
              <span id="jobCount" class="pill">0 个岗位</span>
            </div>

            <div class="filters">
              <input id="jobSearch" type="search" placeholder="搜索技能、岗位、公司" />
              <select id="roleFocus" aria-label="目标方向">
                <option value="product_manager" selected>产品经理优先</option>
                <option value="">自动识别</option>
              </select>
              <select id="companyFilter" aria-label="公司筛选">
                <option value="">全部公司</option>
              </select>
              <select id="jobTypeFilter" aria-label="岗位性质筛选">
                <option value="">全部性质</option>
              </select>
              <select id="categoryFilter" aria-label="类型筛选">
                <option value="">全部类型</option>
              </select>
            </div>

            <div class="batch-bar">
              <button id="batchMatchBtn" type="button" class="secondary-button">批量匹配</button>
              <div class="batch-actions">
                <span id="selectedCount">已选 0 个</span>
                <button id="openReportBtn" type="button" class="ghost-button small-button">查看报告</button>
              </div>
            </div>

            <div id="jobsList" class="jobs-list"></div>
          </section>
        </div>
      </section>

      <section id="reportPage" class="page-view report-page" aria-label="匹配报告">
        <div class="report-shell">
          <section class="panel report-panel">
            <div class="panel-heading">
              <div>
                <span class="section-index">03</span>
                <h2>匹配报告</h2>
              </div>
              <div class="report-actions">
                <span id="reportStamp" class="pill muted">等待匹配</span>
                <button id="backToJobsBtn" type="button" class="ghost-button small-button">返回岗位库</button>
              </div>
            </div>
            <div id="reportView" class="report-view empty-state">上传简历后选择岗位</div>
          </section>

          <aside class="panel ranking-panel">
            <div class="panel-heading">
              <div>
                <span class="section-index">推荐</span>
                <h2>相关内容</h2>
              </div>
              <span class="pill muted">Top10 / 批量排行</span>
            </div>
            <div id="rankingView" class="ranking-view empty-state">解析简历后生成推荐岗位</div>
          </aside>
        </div>
      </section>

      <section id="intelligencePage" class="page-view intelligence-page" aria-label="岗位情报雷达">
        <div class="intelligence-shell">
          <section class="panel intelligence-panel">
            <div class="panel-heading">
              <div>
                <span class="section-index">04</span>
                <h2>岗位情报雷达</h2>
              </div>
              <div class="report-actions">
                <span id="intelligenceStamp" class="pill muted">等待目标岗位</span>
                <button id="backToReportFromIntelBtn" type="button" class="ghost-button small-button">返回匹配报告</button>
              </div>
            </div>

            <div class="intelligence-page-toolbar">
              <div class="intel-target-copy">
                <strong id="intelligenceTargetTitle">尚未选择岗位</strong>
                <span id="intelligenceTargetHint" class="muted">先在岗位工作台完成匹配，或从匹配报告进入岗位情报雷达。</span>
              </div>
              <button id="startIntelligenceBtn" class="secondary-button" type="button" disabled>启动情报雷达</button>
            </div>

            <div id="intelligenceView" class="intelligence-view empty-state">暂无目标岗位</div>
          </section>
        </div>
      </section>
    </main>

    <template id="jobTemplate">
      <article class="job-card">
        <div class="job-select">
          <input type="checkbox" />
        </div>
        <div class="job-body">
          <div class="job-title-row">
            <h3></h3>
            <span class="company"></span>
          </div>
          <p class="job-meta"></p>
          <div class="chips"></div>
        </div>
        <button type="button" class="match-button" title="匹配我的简历">◎</button>
      </article>
    </template>

    <script src="/cover-fallback.js"></script>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
