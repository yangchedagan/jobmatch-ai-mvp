services:
  - type: web
    name: jobmatch-ai-mvp
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
        value: https://jobmatch-ai-mvp.onrender.com
      - key: ADMIN_TOKEN
        sync: false
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: SEMANTIC_MATCH_ENABLED
        value: "true"
      - key: SEMANTIC_MODEL
        value: Xenova/paraphrase-multilingual-MiniLM-L12-v2
